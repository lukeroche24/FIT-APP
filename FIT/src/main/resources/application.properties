spring.application.name=fit

jwt.secret=your-256-bit-secret-key-here-make-it-at-least-32-bytes-long

spring.datasource.url=jdbc:postgresql://localhost:5432/test
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

fit.progression.window-size=5
fit.progression.slope-epsilon=0.25
fit.progression.stalls-before-plateau=3
fit.progression.deload-factor=0.9
fit.progression.hold-after-days=14
fit.progression.deload-after-days=28
fit.strength.estimated-one-rm-days=28
